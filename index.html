<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROVIXSTORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0b;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            background: white;
            color: black;
            padding: 14px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }

        .products {
            padding: 60px 7%;
            text-align: center;
        }

        .products h2 {
            font-size: 35px;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #151515;
            padding: 25px;
            border-radius: 15px;
        }

        .product-img {
            height: 230px;
            background: #222;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #aaa;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ROVIXSTORE</div>

    <nav>
        <a href="#">Home</a>
        <a href="#products">Shop</a>
    </nav>
</header>

<section class="hero">
    <h1>WEAR YOUR STYLE.</h1>
    <p>Premium fashion. Bold identity.</p>

    <a href="#products" class="btn">SHOP NOW</a>
</section>

<section class="products" id="products">

    <h2>Featured Collection</h2>

    <div class="cards">

        <div class="card">
            <div class="product-img">👕</div>
            <h3>Classic T-Shirt</h3>
            <p class="price">₹799</p>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <div class="card">
            <div class="product-img">🧥</div>
            <h3>Street Jacket</h3>
            <p class="price">₹1,499</p>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <div class="card">
            <div class="product-img">👖</div>
            <h3>Urban Jeans</h3>
            <p class="price">₹1,199</p>
            <a href="#" class="btn">Buy Now</a>
        </div>

    </div>

</section>

<footer>
    © 2026 ROVIXSTORE. All Rights Reserved.
</footer>

</body>
</html>
